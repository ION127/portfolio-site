# PR 검사. deploy.yml이 배포 전에 같은 검사를 재사용한다(workflow_call).
name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  TF_VERSION: 1.16.4

jobs:
  web:
    name: web (check · unit · e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # SITE_URL 없이 빌드한다. SEO 테스트가 localhost 주소를 기대한다.
      - run: npm run test:e2e

  static:
    name: static (terraform · actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive infra
      - name: terraform validate · test
        run: |
          for dir in infra/bootstrap infra/site; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  terraform-plan:
    name: terraform plan (infra/site)
    # 포크에서 온 PR에는 OIDC 토큰이 발급되지 않으므로 이 저장소의 PR에서만 돈다.
    # deploy.yml이 호출할 때는 이벤트가 push라서 건너뛴다.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/site
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      # 저장소 변수 SITE_DOMAIN이 비어 있으면 CloudFront 기본 주소를 쓴다.
      TF_VAR_domain_name: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      # plan 역할은 읽기 전용이라 잠금 파일을 쓰지 않는다.
      - run: terraform plan -input=false -lock=false -no-color -out=tfplan
      - name: plan summary
        run: |
          {
            echo '### terraform plan (infra/site)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
