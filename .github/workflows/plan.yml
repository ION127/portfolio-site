# PR에서 infra/site 변경 내용을 읽기 전용 역할로 미리 본다.
# ci.yml과 나눈 이유: deploy.yml이 ci.yml을 재사용하는데, 재사용되는 작업은 호출한 쪽보다 넓은 권한(id-token)을 요청할 수 없다.
name: plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: 1.16.4

jobs:
  terraform-plan:
    name: terraform plan (infra/site)
    # 포크에서 온 PR에는 OIDC 토큰이 발급되지 않으므로 이 저장소의 PR에서만 돈다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/site
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      # 저장소 변수 SITE_DOMAIN이 비어 있으면 CloudFront 기본 주소를 쓴다.
      TF_VAR_domain_name: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      # plan 역할은 읽기 전용이라 잠금 파일을 쓰지 않는다.
      - run: terraform plan -input=false -lock=false -no-color -out=tfplan
      - name: plan summary
        run: |
          {
            echo '### terraform plan (infra/site)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
